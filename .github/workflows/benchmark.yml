name: Benchmark

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  benchmark:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark')
    name: Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Benchmark PR branch
        run: uv run python benchmarks/bench.py --output pr.json

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout
          fetch-depth: 1

      - name: Benchmark main branch
        working-directory: main-checkout
        run: |
          if [ -f benchmarks/bench.py ]; then
            uv run python benchmarks/bench.py --output ../main.json
          else
            echo '{"benchmarks":[]}' > ../main.json
          fi

      - name: Compare results
        run: uv run python benchmarks/compare.py main.json pr.json --output comment.md || true

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- dsperse-benchmark -->"

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body-path: comment.md
          edit-mode: replace
