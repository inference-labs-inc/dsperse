name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: rustup show

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --manifest-path crates/dsperse/Cargo.toml

      - name: Test
        run: cargo test --locked --manifest-path crates/dsperse/Cargo.toml

      - name: Check (with python feature)
        run: cargo check --locked --manifest-path crates/dsperse/Cargo.toml --features python

      - name: Clippy
        run: cargo clippy --locked --manifest-path crates/dsperse/Cargo.toml --all-targets --features python -- -D warnings
