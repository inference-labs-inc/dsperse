name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install dependencies
        run: uv sync

      - name: Debug expander-exec prove
        run: |
          set +e
          echo "=== OPAL paths ==="
          ls -d /usr/share/openmpi /usr/local/share/openmpi /usr/lib64/openmpi/share/openmpi 2>&1 || true

          EXPANDER=$(find .venv -name "expander-exec" -type f 2>/dev/null | head -1)
          LIB_DIR="$(dirname "$EXPANDER")/../lib"
          export LD_LIBRARY_PATH="$LIB_DIR:$LD_LIBRARY_PATH"

          echo "=== Slice + Compile + Witness ==="
          uv run python -c "
          from dsperse.src.cli.slice import slice_model
          from dsperse.src.cli.compile import compile_model
          from dsperse.src.backends.jstprove import JSTprove
          from types import SimpleNamespace
          slice_model(SimpleNamespace(model_dir='tests/models/net', output_dir='/tmp/dbg_slices', save_file=None, output_type='dirs'))
          compile_model(SimpleNamespace(path='/tmp/dbg_slices', input_file=None, layers='0', backend='jstprove'))
          j = JSTprove()
          ok, res = j.generate_witness('tests/models/net/input.json', '/tmp/dbg_slices/slice_0/payload/jstprove/slice_0_circuit.txt', '/tmp/dbg_slices/slice_0/output.json')
          print(f'Witness OK={ok}')
          " 2>&1

          CIRCUIT=$(find /tmp/dbg_slices -name "*_circuit.txt" | head -1)
          WITNESS=$(find /tmp/dbg_slices -name "*witness.bin" | head -1)

          echo "=== prove WITHOUT OPAL_PREFIX ==="
          "$EXPANDER" -p Hyrax prove -c "$CIRCUIT" -w "$WITNESS" -o /tmp/proof_no_opal.json 2>&1
          echo "Exit: $?"

          echo "=== prove WITH OPAL_PREFIX=/usr ==="
          OPAL_PREFIX=/usr "$EXPANDER" -p Hyrax prove -c "$CIRCUIT" -w "$WITNESS" -o /tmp/proof_opal.json 2>&1
          echo "Exit: $?"

      - name: Run Integration Tests
        run: uv run pytest tests/integration/test_slice.py tests/integration/test_compile.py tests/integration/test_pipeline.py tests/integration/test_full_run.py -m "not slow"
