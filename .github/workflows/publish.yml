name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-14
            target: x86_64
          - os: macos-14
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Update pyproject.toml with tag version
        run: |
          set -euo pipefail
          python3 -c "
          import re
          version = '${{ steps.version.outputs.version }}'
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          updated = re.sub(
              r'^version\s*=\s*[\"\'](.*?)[\"\']',
              f'version = \"{version}\"',
              content,
              flags=re.MULTILINE
          )
          with open('pyproject.toml', 'w') as f:
              f.write(updated)
          "

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Update pyproject.toml with tag version
        run: |
          set -euo pipefail
          python3 -c "
          import re
          version = '${{ steps.version.outputs.version }}'
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          updated = re.sub(
              r'^version\s*=\s*[\"\'](.*?)[\"\']',
              f'version = \"{version}\"',
              content,
              flags=re.MULTILINE
          )
          with open('pyproject.toml', 'w') as f:
              f.write(updated)
          "

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
