<style>

  :root {
    --bg:#040d1a; --grid:rgba(0,140,255,0.04);

    --blue-mid:#2a7fff; --blue-sky:#38b6ff;
    --blue-corn:#4d8fff; --blue-steel:#60cfff;
    --red:#ff3355;
    --text:#b8d4f0; --panel:rgba(4,15,35,0.96);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);font-family:'Oxanium',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;position:relative;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:1;}
  .wrapper{position:relative;z-index:2;padding:32px 24px 56px;max-width:1460px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:32px;}
  .logo{width:58px;height:58px;border-radius:13px;border:1.5px solid rgba(77,143,255,0.35);box-shadow:0 0 28px rgba(42,127,255,0.25),inset 0 0 14px rgba(42,127,255,0.07);flex-shrink:0;overflow:hidden;object-fit:cover;}
  header h1{font-weight:800;font-size:clamp(1.3rem,3vw,2.1rem);letter-spacing:0.06em;color:#60cfff;text-shadow:0 0 28px rgba(96,207,255,0.5);text-transform:uppercase;line-height:1;}
  header p{font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:rgba(96,207,255,0.6);letter-spacing:0.14em;margin-top:6px;}
  .divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,#4d8fff,rgba(26,140,255,0.5),transparent);margin-bottom:18px;opacity:0.35;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:24px;}
  .legend-item{display:flex;align-items:center;gap:7px;font-family:'Share Tech Mono',monospace;font-size:0.68rem;letter-spacing:0.1em;color:rgba(184,212,240,0.55);}
  .ld{width:11px;height:11px;border-radius:2px;flex-shrink:0;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .info-panel{position:fixed;bottom:22px;right:22px;width:290px;background:var(--panel);border:1px solid rgba(77,143,255,0.2);border-left:3px solid #4d8fff;padding:16px 18px;font-family:'Share Tech Mono',monospace;font-size:0.71rem;line-height:1.65;opacity:0;transform:translateY(10px);transition:all 0.28s ease;pointer-events:none;z-index:100;box-shadow:0 0 40px rgba(77,143,255,0.1);}
  .info-panel.visible{opacity:1;transform:translateY(0);}
  .info-title{font-family:'Oxanium',sans-serif;font-weight:700;font-size:0.83rem;color:#60cfff;margin-bottom:8px;letter-spacing:0.05em;}
  .info-desc{color:rgba(184,212,240,0.7);}
  .info-tag{display:inline-block;margin-top:10px;padding:2px 8px;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;}
  .ti{background:rgba(26,140,255,.12);color:#1a8cff;border:1px solid #1a8cff;}
  .tg{background:rgba(42,127,255,.12);color:#2a7fff;border:1px solid #2a7fff;}
  .tb{background:rgba(255,51,85,.1);color:#ff3355;border:1px solid #ff3355;}
  .ta{background:rgba(0,255,170,.1);color:#00ffaa;border:1px solid #00ffaa;}
  .tz{background:rgba(77,143,255,.13);color:#4d8fff;border:1px solid #4d8fff;}
  .tm{background:rgba(96,207,255,.1);color:#60cfff;border:1px solid #60cfff;}
  .status-bar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:11px 20px;border:1px solid rgba(42,127,255,0.12);background:rgba(42,127,255,0.02);}
  .si{font-family:'Share Tech Mono',monospace;font-size:0.63rem;color:rgba(96,207,255,0.45);letter-spacing:0.1em;display:flex;align-items:center;gap:7px;}
  .sd{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;box-shadow:0 0 6px var(--green);}
  .sd.b{background:#4d8fff;box-shadow:0 0 6px #4d8fff;animation-delay:.6s;}
  .sd.r{background:#ff3355;box-shadow:0 0 6px #ff3355;animation-delay:1.2s;}
  @keyframes dash{to{stroke-dashoffset:-20;}}
  .da{animation:dash .8s linear infinite;}
  .db{animation:dash 1.0s linear infinite;}
  .dc{animation:dash 1.2s linear infinite;}
  .dd{animation:dash 1.6s linear infinite;}
</style>
